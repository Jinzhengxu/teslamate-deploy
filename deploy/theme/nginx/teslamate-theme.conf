# TeslaMate 换肤代理 —— 夹在 Caddy 和 teslamate:4000 之间（docker-compose.yml 里的 teslamate-theme）
#
# 做的事有三件：
#   1. 给 TeslaMate 返回的 HTML 在 </head> 前插一行 <link> 和 <script>，引入 /_theme/ 下的样式和脚本；
#   2. 把 /_theme/ 映射到 deploy/theme/assets；
#   3. 把 /stats/ 映射到 deploy/theme/assets/stats（原生统计页，数据经 /grafana 查询）。
# 改了这个文件后重新运行 deploy.sh（会先 nginx -t 校验再 reload）。
# 其余请求（包括 LiveView 的 websocket）原样转发。TeslaMate 本身一行不改，升级镜像不受影响。
# 这个容器挂了也不要紧：Caddy 那边配了回落，会直接连 teslamate:4000，只是变回原版界面。

map $http_upgrade $connection_upgrade {
	default upgrade;
	""      close;
}

server {
	listen 8080;
	server_tokens off;

	# 用 docker 内置 DNS 动态解析：teslamate 重建、换 IP 后不用重启 nginx，
	# nginx 先于 teslamate 启动也不会因为解析不到而起不来
	resolver 127.0.0.11 valid=10s ipv6=off;
	set $teslamate http://teslamate:4000;

	location /_theme/ {
		alias /srv/theme/;
		# 每次都带 ETag 回源校验，改完样式刷新即生效；没变时只回 304
		add_header Cache-Control "no-cache" always;
	}

	# 原生统计页（deploy/theme/assets/stats/，单页应用）。
	# 跳转只写路径：nginx 自己只知道 8080 端口，写成完整地址浏览器会跳到错的端口
	absolute_redirect off;

	location = /stats {
		return 302 /stats/;
	}

	location /stats/ {
		root /srv/theme;
		add_header Cache-Control "no-cache" always;
		# /stats/drives/123 这类前端路由没有对应文件，都交给 index.html；
		# 带下面那条规则里的静态扩展名（.js .css …）的文件找不到才是真的 404
		try_files $uri @stats_app;
	}

	# 只认真实的静态文件扩展名（和 stats/app.js 里的 STATIC_FILE 保持一致）：
	# /stats/drives/1.5 这种路径要回落到 index.html，由路由显示「找不到这条记录」，不能回 nginx 自带的 404 页
	location ~ ^/stats/.+\.(js|css|png|svg|json|map|woff2?|ico|txt|webp)$ {
		root /srv/theme;
		add_header Cache-Control "no-cache" always;
		try_files $uri =404;
	}

	# 第三方库按版本号分目录，内容永远不变，让浏览器长期缓存（国内访问美国服务器，省掉每次的回源）
	location ^~ /stats/vendor/ {
		root /srv/theme;
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	location @stats_app {
		root /srv/theme;
		add_header Cache-Control "no-cache" always;
		rewrite ^ /stats/index.html break;
	}

	location / {
		proxy_pass $teslamate;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
		# sub_filter 只能改未压缩的内容；压缩交给外面的 Caddy（encode zstd gzip）
		proxy_set_header Accept-Encoding "";
		# LiveView 的 websocket 是长连接（客户端每 30s 心跳），别被默认 60s 超时掐断
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;

		# sub_filter 默认只处理 text/html，正好只改页面
		sub_filter_once on;
		sub_filter '</head>' '<link rel="stylesheet" href="/_theme/theme.css"><script defer src="/_theme/theme.js"></script></head>';
	}
}
